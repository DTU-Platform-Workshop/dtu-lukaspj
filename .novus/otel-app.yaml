apiVersion: novus.legogroup.io/v1alpha1
kind: WebApp
metadata:
  name: otel-app
spec:
  ingress:
    subdomain: otel-app
  service:
    image:
      # Make sure to update these values:
      repository: ghcr.io/dtu-platform-workshop/dtu-<your-username>/otel-app
      tag: <insert-tag>

    useSamePortForHealthProbes: true

    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
