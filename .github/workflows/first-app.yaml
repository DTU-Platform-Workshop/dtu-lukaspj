name: first-app build and push to GHCR
on:
  pull_request:
    paths:
      - .github/workflows/first-app.yaml
      - first-app/**

  push:
    branches:
      - main
    paths:
      - .github/workflows/first-app.yaml
      - first-app/**

env:
  IMAGE: first-app
  CONTEXT: first-app

jobs:
  build:
    permissions:
      # For OIDC setup
      contents: read
      id-token: write
      # Additional permissions for GitHub packages
      packages: write
      attestations: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [ amd64, arm64 ]
    steps:
      - name: create token
        id: create-token
        run: |
          ID_TOKEN=$(curl -sLS -H "User-Agent: actions/oidc-client" -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=lego-github" | jq -r .value)
          echo "token=$ID_TOKEN" >> $GITHUB_OUTPUT

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ contains(fromJSON('["pull_request_target", "pull_request"]'), github.event_name) && github.event.pull_request.head.sha || null }}
          fetch-depth: '1'
          persist-credentials: false

      - name: Set up Docker Buildx 🐋
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to ghcr
        uses: docker/login-action@7ca345011ac4304463197fac0e56eab1bc7e6af0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get package version
        id: package-version
        run: |
          echo "version=$(git show -s --format=%cd --date=format:%Y%m%d HEAD)-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96
        with:
          images: ghcr.io/lego/${{ github.event.repository.name }}/${{ env.IMAGE }}
          tags: ${{ steps.package-version.outputs.version }}

      - name: Build and push by digest
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        id: build
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.CONTEXT }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/lego/${{ github.event.repository.name }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/lego/${{ github.event.repository.name }}/${{ env.IMAGE }}-${{ matrix.arch }}:buildcache
          cache-to: type=registry,ref=ghcr.io/lego/${{ github.event.repository.name }}/${{ env.IMAGE }}-${{ matrix.arch }}:buildcache,mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digests
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Generate ghcr artifact attestation 🎖️
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/lego/${{ github.event.repository.name }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # For OIDC setup
      contents: read
      id-token: write
      # Additional permissions for GitHub packages
      packages: write
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          ref: ${{ contains(fromJSON('["pull_request_target", "pull_request"]'), github.event_name) && github.event.pull_request.head.sha || null }}
          fetch-depth: '1'

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx 🐋
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr
        uses: docker/login-action@7ca345011ac4304463197fac0e56eab1bc7e6af0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get package version
        id: package-version
        run: |
          echo "version=$(git show -s --format=%cd --date=format:%Y%m%d HEAD)-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96
        with:
          images: ghcr.io/lego/${{ github.event.repository.name }}/${{ env.IMAGE }}
          # Only immutable <YYYYMMDD>-<shortsha> tags. No `latest`: cluster
          # admission policy (Kyverno novus-image-tags) rejects mutable tags,
          # and the Helm chart requires an explicit immutable tag anyway.
          tags: ${{ steps.package-version.outputs.version }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/lego/${{ github.event.repository.name }}/${{ env.IMAGE }}@sha256:%s ' *)

      - name: Deploy hint
        run: |
          TAG="${{ steps.package-version.outputs.version }}"
          {
            echo "## simple-remote-warehouse image published"
            echo ""
            echo "Immutable tag: \`$TAG\`"
            echo ""
            echo "Image: \`ghcr.io/lego/${{ github.event.repository.name }}/${{ env.IMAGE }}:$TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"