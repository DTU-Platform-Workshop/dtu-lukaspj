name: simple-remote-warehouse to GHCR
on:
  push:
    branches: [main]
    paths:
      - simple-remote-warehouse/**
      - .github/workflows/simple-remote-warehouse-image.yaml

env:
  IMAGE: first-app
  CONTEXT: first-app

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Get package version
        id: package-version
        run: |
          echo "version=$(git show -s --format=%cd --date=format:%Y%m%d HEAD)-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          push: true
          tags: ghcr.io/${{ github.event.repository.owner }}/${{ github.event.repository.name }}/${{ env.IMAGE }}:${{ steps.package-version.outputs.version }}
